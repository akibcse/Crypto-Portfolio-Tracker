<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Portfolio Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #00dc82, #00c4cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 1rem;
            color: #94a3b8;
        }
        
        .positive {
            color: #00dc82;
        }
        
        .negative {
            color: #ef4444;
        }
        
        .portfolio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .portfolio-title {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .btn {
            background: linear-gradient(to right, #00dc82, #00c4cc);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 220, 130, 0.3);
        }
        
        .btn i {
            font-size: 1rem;
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 16px 20px;
            text-align: left;
        }
        
        thead {
            background: rgba(15, 23, 42, 0.8);
        }
        
        th {
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            user-select: none;
        }
        
        th:hover {
            background: rgba(30, 41, 59, 0.8);
        }
        
        th i {
            margin-left: 5px;
            font-size: 0.8rem;
        }
        
        tbody tr {
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            transition: background 0.2s;
        }
        
        tbody tr:last-child {
            border-bottom: none;
        }
        
        tbody tr:hover {
            background: rgba(30, 41, 59, 0.8);
        }
        
        .coin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .coin-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00dc82, #00c4cc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #0f172a;
        }
        
        .coin-name {
            font-weight: 500;
        }
        
        .coin-symbol {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .action-btn:hover {
            background: rgba(15, 23, 42, 0.8);
        }
        
        .action-btn.edit:hover {
            color: #00dc82;
        }
        
        .action-btn.delete:hover {
            color: #ef4444;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .modal.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        
        .modal.active .modal-content {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .close-btn:hover {
            color: #e2e8f0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #94a3b8;
        }
        
        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #00dc82;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn-secondary {
            background: rgba(30, 41, 59, 0.6);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(30, 41, 59, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-state p {
            margin-top: 10px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            th, td {
                padding: 14px 16px;
            }
            
            .portfolio-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Crypto Portfolio Tracker</h1>
            <p class="subtitle">Manage your cryptocurrency investments with real-time tracking and analytics</p>
        </header>
        
        <div class="dashboard">
            <div class="card stat">
                <div class="stat-value" id="portfolioValue">$4,786.43</div>
                <div class="stat-label">Portfolio Value</div>
            </div>
            <div class="card stat">
                <div class="stat-value positive" id="totalProfit">+$428.51</div>
                <div class="stat-label">Total Profit/Loss</div>
            </div>
            <div class="card stat">
                <div class="stat-value positive" id="portfolioChange">+12.5%</div>
                <div class="stat-label">24h Change</div>
            </div>
            <div class="card stat">
                <div class="stat-value" id="assetCount">4</div>
                <div class="stat-label">Assets</div>
            </div>
        </div>
        
        <div class="portfolio-header">
            <h2 class="portfolio-title">Your Holdings</h2>
            <button class="btn" id="addCoinBtn">
                <i class="fas fa-plus"></i> Add Coin
            </button>
        </div>
        
        <div class="table-container">
            <table id="portfolioTable">
                <thead>
                    <tr>
                        <th data-sort="name">Coin <i class="fas fa-sort"></i></th>
                        <th data-sort="price">Price <i class="fas fa-sort"></i></th>
                        <th data-sort="holdings">Holdings <i class="fas fa-sort"></i></th>
                        <th data-sort="value">Value <i class="fas fa-sort"></i></th>
                        <th data-sort="profit">Profit/Loss <i class="fas fa-sort"></i></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Add/Edit Coin Modal -->
    <div class="modal" id="coinModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add New Coin</h3>
                <button class="close-btn" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="coinForm">
                <input type="hidden" id="coinId">
                <div class="form-group">
                    <label for="coinName">Coin Name</label>
                    <input type="text" id="coinName" placeholder="e.g. Bitcoin" required>
                </div>
                <div class="form-group">
                    <label for="coinSymbol">Symbol</label>
                    <input type="text" id="coinSymbol" placeholder="e.g. BTC" required>
                </div>
                <div class="form-group">
                    <label for="buyPrice">Buy Price (USD)</label>
                    <input type="number" step="0.00000001" id="buyPrice" placeholder="e.g. 42000.50" required>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" step="0.00000001" id="quantity" placeholder="e.g. 1.5" required>
                </div>
                <div class="form-group">
                    <label for="currentPrice">Current Price (USD)</label>
                    <input type="number" step="0.00000001" id="currentPrice" placeholder="e.g. 45000.75" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn" id="saveBtn">Save Coin</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Database functions
        const DB_NAME = "cryptoPortfolioDB";
        
        function initDatabase() {
            if (!localStorage.getItem(DB_NAME)) {
                const defaultData = {
                    coins: [
                        {
                            id: 1,
                            name: "Bitcoin",
                            symbol: "BTC",
                            buyPrice: 42000.50,
                            quantity: 0.5,
                            currentPrice: 45000.75
                        },
                        {
                            id: 2,
                            name: "Ethereum",
                            symbol: "ETH",
                            buyPrice: 2500.25,
                            quantity: 3.2,
                            currentPrice: 2800.40
                        },
                        {
                            id: 3,
                            name: "Solana",
                            symbol: "SOL",
                            buyPrice: 174.31,
                            quantity: 8,
                            currentPrice: 192.45
                        },
                        {
                            id: 4,
                            name: "Cardano",
                            symbol: "ADA",
                            buyPrice: 1.25,
                            quantity: 1000,
                            currentPrice: 1.32
                        }
                    ],
                    lastUpdated: new Date().toISOString()
                };
                localStorage.setItem(DB_NAME, JSON.stringify(defaultData));
            }
            return JSON.parse(localStorage.getItem(DB_NAME));
        }
        
        function saveDatabase(data) {
            localStorage.setItem(DB_NAME, JSON.stringify(data));
        }
        
        function getAllCoins() {
            const db = initDatabase();
            return db.coins;
        }
        
        function addCoin(coin) {
            const db = initDatabase();
            const newId = db.coins.length > 0 ? Math.max(...db.coins.map(c => c.id)) + 1 : 1;
            coin.id = newId;
            db.coins.push(coin);
            saveDatabase(db);
            return coin;
        }
        
        function updateCoin(updatedCoin) {
            const db = initDatabase();
            const index = db.coins.findIndex(c => c.id === updatedCoin.id);
            if (index !== -1) {
                db.coins[index] = updatedCoin;
                saveDatabase(db);
                return true;
            }
            return false;
        }
        
        function deleteCoin(coinId) {
            const db = initDatabase();
            const initialLength = db.coins.length;
            db.coins = db.coins.filter(c => c.id !== coinId);
            saveDatabase(db);
            return db.coins.length !== initialLength;
        }
        
        // DOM elements
        const coinModal = document.getElementById('coinModal');
        const modalTitle = document.getElementById('modalTitle');
        const coinForm = document.getElementById('coinForm');
        const coinId = document.getElementById('coinId');
        const coinName = document.getElementById('coinName');
        const coinSymbol = document.getElementById('coinSymbol');
        const buyPrice = document.getElementById('buyPrice');
        const quantity = document.getElementById('quantity');
        const currentPrice = document.getElementById('currentPrice');
        const portfolioTable = document.getElementById('portfolioTable');
        const portfolioValue = document.getElementById('portfolioValue');
        const totalProfit = document.getElementById('totalProfit');
        const portfolioChange = document.getElementById('portfolioChange');
        const assetCount = document.getElementById('assetCount');
        
        // Open modal for adding a new coin
        document.getElementById('addCoinBtn').addEventListener('click', () => {
            coinId.value = '';
            coinForm.reset();
            modalTitle.textContent = 'Add New Coin';
            coinModal.classList.add('active');
        });
        
        // Close modal
        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        
        function closeModal() {
            coinModal.classList.remove('active');
        }
        
        // Save coin (add or update)
        coinForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const coinData = {
                id: coinId.value ? parseInt(coinId.value) : null,
                name: coinName.value,
                symbol: coinSymbol.value,
                buyPrice: parseFloat(buyPrice.value),
                quantity: parseFloat(quantity.value),
                currentPrice: parseFloat(currentPrice.value)
            };
            
            if (coinData.id) {
                updateCoin(coinData);
            } else {
                addCoin(coinData);
            }
            
            renderPortfolio();
            closeModal();
        });
        
        // Delete coin
        function deleteCoinHandler(coinId) {
            if (confirm('Are you sure you want to delete this coin from your portfolio?')) {
                deleteCoin(coinId);
                renderPortfolio();
            }
        }
        
        // Edit coin
        function editCoinHandler(coinId) {
            const coin = getAllCoins().find(c => c.id === coinId);
            if (coin) {
                coinId.value = coin.id;
                coinName.value = coin.name;
                coinSymbol.value = coin.symbol;
                buyPrice.value = coin.buyPrice;
                quantity.value = coin.quantity;
                currentPrice.value = coin.currentPrice;
                
                modalTitle.textContent = 'Edit Coin';
                coinModal.classList.add('active');
            }
        }
        
        // Calculate coin stats
        function calculateCoinStats(coin) {
            const value = coin.quantity * coin.currentPrice;
            const costBasis = coin.quantity * coin.buyPrice;
            const profitLoss = value - costBasis;
            const profitLossPercent = (profitLoss / costBasis) * 100;
            
            return {
                value,
                costBasis,
                profitLoss,
                profitLossPercent
            };
        }
        
        // Calculate portfolio stats
        function calculatePortfolioStats() {
            const coins = getAllCoins();
            let totalValue = 0;
            let totalCost = 0;
            
            coins.forEach(coin => {
                const stats = calculateCoinStats(coin);
                totalValue += stats.value;
                totalCost += stats.costBasis;
            });
            
            const totalProfit = totalValue - totalCost;
            const totalProfitPercent = (totalProfit / totalCost) * 100;
            
            return {
                totalValue,
                totalProfit,
                totalProfitPercent,
                assetCount: coins.length
            };
        }
        
        // Render portfolio
        function renderPortfolio() {
            const coins = getAllCoins();
            const tbody = portfolioTable.querySelector('tbody');
            tbody.innerHTML = '';
            
            if (coins.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-coins"></i>
                                <h3>No coins in your portfolio</h3>
                                <p>Add your first cryptocurrency to start tracking your investments</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                coins.forEach(coin => {
                    const stats = calculateCoinStats(coin);
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>
                            <div class="coin-info">
                                <div class="coin-icon">${coin.symbol.charAt(0)}</div>
                                <div>
                                    <div class="coin-name">${coin.name}</div>
                                    <div class="coin-symbol">${coin.symbol}</div>
                                </div>
                            </div>
                        </td>
                        <td>$${coin.currentPrice.toLocaleString('en-US', { maximumFractionDigits: 8 })}</td>
                        <td>${coin.quantity.toLocaleString('en-US', { maximumFractionDigits: 8 })}</td>
                        <td>$${stats.value.toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>
                        <td class="${stats.profitLoss >= 0 ? 'positive' : 'negative'}">
                            ${stats.profitLoss >= 0 ? '+' : ''}$${Math.abs(stats.profitLoss).toLocaleString('en-US', { maximumFractionDigits: 2 })} 
                            (${stats.profitLossPercent >= 0 ? '+' : ''}${stats.profitLossPercent.toFixed(2)}%)
                        </td>
                        <td>
                            <div class="actions">
                                <div class="action-btn edit" onclick="editCoinHandler(${coin.id})">
                                    <i class="fas fa-edit"></i>
                                </div>
                                <div class="action-btn delete" onclick="deleteCoinHandler(${coin.id})">
                                    <i class="fas fa-trash"></i>
                                </div>
                            </div>
                        </td>
                    `;
                    
                    tbody.appendChild(tr);
                });
            }
            
            // Update portfolio stats
            const portfolioStats = calculatePortfolioStats();
            portfolioValue.textContent = `$${portfolioStats.totalValue.toLocaleString('en-US', { maximumFractionDigits: 2 })}`;
            totalProfit.textContent = `${portfolioStats.totalProfit >= 0 ? '+' : '-'}$${Math.abs(portfolioStats.totalProfit).toLocaleString('en-US', { maximumFractionDigits: 2 })}`;
            portfolioChange.textContent = `${portfolioStats.totalProfitPercent >= 0 ? '+' : ''}${portfolioStats.totalProfitPercent.toFixed(2)}%`;
            assetCount.textContent = portfolioStats.assetCount;
            
            // Update profit color
            totalProfit.className = portfolioStats.totalProfit >= 0 ? 'stat-value positive' : 'stat-value negative';
            portfolioChange.className = portfolioStats.totalProfitPercent >= 0 ? 'stat-value positive' : 'stat-value negative';
        }
        
        // Initialize table sorting
        function initTableSorting() {
            const ths = document.querySelectorAll('th[data-sort]');
            let sortColumn = 'name';
            let sortDirection = 'asc';
            
            ths.forEach(th => {
                th.addEventListener('click', () => {
                    const column = th.getAttribute('data-sort');
                    
                    if (sortColumn === column) {
                        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortColumn = column;
                        sortDirection = 'asc';
                    }
                    
                    sortTable(column, sortDirection);
                    updateSortIndicators(column, sortDirection);
                });
            });
        }
        
        function sortTable(column, direction) {
            const coins = getAllCoins();
            
            coins.sort((a, b) => {
                let valA, valB;
                
                switch (column) {
                    case 'name':
                        valA = a.name.toLowerCase();
                        valB = b.name.toLowerCase();
                        break;
                    case 'price':
                        valA = a.currentPrice;
                        valB = b.currentPrice;
                        break;
                    case 'holdings':
                        valA = a.quantity;
                        valB = b.quantity;
                        break;
                    case 'value':
                        valA = a.quantity * a.currentPrice;
                        valB = b.quantity * b.currentPrice;
                        break;
                    case 'profit':
                        valA = (a.quantity * a.currentPrice) - (a.quantity * a.buyPrice);
                        valB = (b.quantity * b.currentPrice) - (b.quantity * b.buyPrice);
                        break;
                }
                
                if (typeof valA === 'string') {
                    return direction === 'asc' 
                        ? valA.localeCompare(valB) 
                        : valB.localeCompare(valA);
                } else {
                    return direction === 'asc' 
                        ? valA - valB 
                        : valB - valA;
                }
            });
            
            // Save sorted coins temporarily
            const db = initDatabase();
            db.coins = coins;
            saveDatabase(db);
            
            renderPortfolio();
        }
        
        function updateSortIndicators(column, direction) {
            const ths = document.querySelectorAll('th[data-sort]');
            
            ths.forEach(th => {
                const icon = th.querySelector('i');
                if (th.getAttribute('data-sort') === column) {
                    icon.className = direction === 'asc' 
                        ? 'fas fa-sort-up' 
                        : 'fas fa-sort-down';
                } else {
                    icon.className = 'fas fa-sort';
                }
            });
        }
        
        // Initialize the application
        function initApp() {
            initDatabase();
            renderPortfolio();
            initTableSorting();
        }
        
        // Run the app
        initApp();
    </script>
</body>
</html>
